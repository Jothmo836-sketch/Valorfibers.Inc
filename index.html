
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorfibres Inc | Precision Infrastructure Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
        }
        .heading-font {
            font-family: 'Oswald', sans-serif;
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border-bottom: 3px solid #f97316;
        }
        .industrial-pattern {
            background-color: transparent;
            background-image: radial-gradient(#374151 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }
        .orange-glow {
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.3);
        }
        .text-glow {
            text-shadow: 0 0 25px rgba(249, 115, 22, 0.6);
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        
        @keyframes slowZoom {
          0% { transform: scale(1.0); }
          100% { transform: scale(1.1); }
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .animate-slow-zoom {
          animation: slowZoom 25s infinite alternate ease-in-out;
        }
        
        /* Modern Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #f97316;
            border-radius: 0px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ea580c;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .heading-font {
                letter-spacing: -0.05em;
            }
        }
    </style>
<script type="importmap">

</html>
